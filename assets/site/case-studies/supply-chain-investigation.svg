<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" fill="none">
  <title>从渠道履行异常追查信用控制，再形成放行请求</title>
  <desc>按案例正文展示渠道 B 履行率下降、鞋类第二至第三周异常、信用控制冻结订单，以及交由客户经理和信用控制团队审批的过程。</desc>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.label{fill:#7d897d;font-size:15px}.main{fill:#354838;font-size:20px;font-weight:500}.detail{fill:#899283;font-size:14px}</style>
  <path fill="#edf1e9" d="M0 0h660v440H0z"/>
  <rect x="30" y="27" width="600" height="386" rx="12" fill="#fcfdfa" stroke="#dce3d6"/>
  <path d="M31 77h598" stroke="#e6ebe1"/>
  <rect x="49" y="43" width="26" height="21" rx="5" fill="#edf3e9"/>
  <path d="M56 59v-5m6 5V48m6 11v-8" stroke="#70876a" stroke-width="1.6" stroke-linecap="round"/>
  <text x="87" y="60" class="main" style="font-size:17px">渠道履行分析</text><text x="541" y="59" class="label" style="font-size:13px">渠道 B</text>
  <text x="59" y="116" class="main" style="font-size:22px">履行率为什么下降？</text>
  <text x="59" y="143" class="label" style="font-size:14px">沿着一项异常，查到具体的处理条件。</text>
  <path d="M90 179v170" stroke="#d2ddca" stroke-width="1.5"/>
  <circle cx="90" cy="192" r="16" fill="#f4f0e5" stroke="#e5ddc7"/><path d="m84 188 5 5 6-7m-6 7v4" stroke="#a19574" stroke-width="1.4"/>
  <rect x="123" y="168" width="474" height="62" rx="7" fill="#fff" stroke="#e1e7dc"/>
  <text x="141" y="193" class="main" style="font-size:17px">订单履行异常</text><text x="141" y="215" class="detail">异常集中在鞋类 · 第 2–3 周</text>
  <rect x="516" y="184" width="61" height="23" rx="5" fill="#f5f1e6"/><text x="530" y="200" class="detail" style="font-size:12px" fill="#9f8f69">待调查</text>
  <circle cx="90" cy="274" r="16" fill="#eef3e8" stroke="#d8e2ce"/><path d="M84 272a5 5 0 1 1 10 0 5 5 0 0 1-10 0Zm8 4 5 5" stroke="#7d9370" stroke-width="1.4"/>
  <rect x="123" y="248" width="474" height="62" rx="7" fill="#fff" stroke="#e1e7dc"/>
  <text x="141" y="273" class="main" style="font-size:17px">信用控制触发</text><text x="141" y="295" class="detail">未付款订单 → 订单冻结</text>
  <rect x="516" y="264" width="61" height="23" rx="5" fill="#edf3e8"/><text x="530" y="280" class="detail" style="font-size:12px">已定位</text>
  <circle cx="90" cy="357" r="16" fill="#dce9d3" stroke="#c5d8b9"/><path d="M84 357h11m-5-5 5 5-5 5" stroke="#688259" stroke-width="1.5"/>
  <rect x="123" y="328" width="474" height="62" rx="7" fill="#eff5e8" stroke="#cdddc1"/>
  <text x="141" y="353" class="main" style="font-size:17px">形成订单放行请求</text><text x="141" y="375" class="detail">客户经理 · 信用控制团队</text>
  <rect x="516" y="344" width="61" height="23" rx="5" fill="#fcfdf9" stroke="#dbe5d3"/><text x="530" y="360" class="detail" style="font-size:12px">待审批</text>
</svg>
