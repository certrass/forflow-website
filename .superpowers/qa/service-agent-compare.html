<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service visual comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #e9eae7; color: #111; font: 14px/1.5 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; max-width: 1500px; margin: auto; }
    figure { margin: 0; overflow: hidden; border: 1px solid #cfd2cc; border-radius: 12px; background: #fff; }
    img { display: block; width: 100%; object-fit: contain; background: #fff; }
    figcaption { padding: 12px 14px; border-top: 1px solid #ddd; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <figure><img src="sana-leadership-reference.webp" alt="Sana reference"><figcaption>Sana reference: high-key portrait restraint</figcaption></figure>
    <figure><img src="forflow-service-agent-desktop.jpg" alt="ForFlow pilot"><figcaption>ForFlow pilot: enterprise Agent service page</figcaption></figure>
  </main>
</body>
</html>
