[build]
  command = "python3 scripts/build_public.py"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/q/:code"
  to = "/.netlify/functions/q/:code"
  status = 200

[[edge_functions]]
  path = "/*"
  function = "auth-gate"
  excludedPath = ["/product/one", "/product/one/*", "/company", "/company/*"]

[[redirects]]
  from = "/product/one/ai-governance"
  to = "/product/one/ai-governance.html"
  status = 200

[[headers]]
  for = "/product/one/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/company"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/company/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
